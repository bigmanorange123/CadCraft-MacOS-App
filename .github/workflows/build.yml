name: Build and release macOS apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install cloudflared for packaging
        run: brew install cloudflared

      - name: Test connection service
        run: |
          cd cadcraft-connect
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test

      - name: Build app bundle
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            APP_VERSION="0.1.0"
          fi
          export APP_VERSION
          export BUNDLED_NODE="$(command -v node)"
          export BUNDLED_CLOUDFLARED="$(brew --prefix cloudflared)/bin/cloudflared"
          APP="dist/CadCraft-Connect-${TARGET_ARCH}.app"
          ./scripts/build-app.sh "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          DMG_ROOT="$RUNNER_TEMP/CadCraft-Connect-dmg-${TARGET_ARCH}"
          mkdir -p "$DMG_ROOT"
          ditto "$APP" "$DMG_ROOT/$(basename "$APP")"
          ln -s /Applications "$DMG_ROOT/Applications"
          DMG="${APP%.app}.dmg"
          hdiutil create \
            -volname "CadCraft Connect ${TARGET_ARCH}" \
            -srcfolder "$DMG_ROOT" \
            -ov \
            -format UDZO \
            "$DMG"

      - name: Upload architecture artifact
        uses: actions/upload-artifact@v4
        with:
          name: CadCraft-Connect-${{ matrix.arch }}
          path: dist/CadCraft-Connect-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Intel and Apple Silicon builds
        uses: actions/download-artifact@v4
        with:
          pattern: CadCraft-Connect-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/*.dmg --clobber
          else
            gh release create "$TAG" release-assets/*.dmg --generate-notes
          fi
